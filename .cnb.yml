# .cnb.yml
$:
  vscode:
    - docker:
        build: .cnb_dockerfile
        # 指定开发环境镜像，可以是任意可访问的镜像。
        # 如果 image 指定的镜像中已安装 code-server 代码服务，将使用单容器模式启动开发环境
        # 如果 image 指定的镜像中未安装 code-server 代码服务，将使用双容器模式启动开发环境
        # 如下镜像为 CNB 默认开发环境镜像，已安装代码服务，将使用单容器模式启动开发环境
        # 可按需替换为其他镜像
        #image: node:20.16.0
      services:
        - vscode
        - docker
      # 开发环境启动后会执行的任务
      stages:
        - name: tb
          script: npm config set registry https://registry.npmmirror.com
        - name: pnpm
          script: npm install -g pnpm 
        - name: install
          script: pnpm install
        # - name: setup
        #   script: pnpm run dokploy:setup
        # - name: script
        #   script: pnpm run server:script
        - name: copy
          script: cp apps/dokploy/.env.example apps/dokploy/.env
canary:
  push:
    - runner:
        cpus: 64
    - services:
        - docker #声明后，流水线内可以直接使用docker命令
      env: 
        BETTER_AUTH_SECRET: "Kp8$rL2xQm5zTj9wSd3fGh7vBn6yUj2k"
      stages:
        - name: set docker tag
          script: echo -n "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest"
          exports:
            info: IMAGE_TAG

        - name: docker build
          script: docker build -t $IMAGE_TAG .

        - name: push image
          script: docker push $IMAGE_TAG